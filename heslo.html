<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Přístup k výukovým materiálům</title>
  <style>
    :root {
      --primary: #1d4ed8;
      --bg-start: #f8fafc;
      --bg-end: #eef3f9;
      --card-bg: rgba(255,255,255,0.96);
      --border: #e5e7eb;
      --text: #111827;
      --muted: #4b5563;
      --badge-bg: #eef5ff;
      --badge-text: #1d4ed8;
      --input-bg: #ffffff;
      --input-text: #111827;
      --input-border: #d1d5db;
      --input-focus: rgba(37, 99, 235, 0.12);
      --error: #b91c1c;
      --divider: #e5e7eb;
      --link: #1d4ed8;
      --button-start: #2d6cdf;
      --button-end: #1d4ed8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-start: #0f172a;
        --bg-end: #111827;
        --card-bg: rgba(17, 24, 39, 0.88);
        --border: #374151;
        --text: #f9fafb;
        --muted: #d1d5db;
        --badge-bg: rgba(37, 99, 235, 0.18);
        --badge-text: #bfdbfe;
        --input-bg: #0b1220;
        --input-text: #f9fafb;
        --input-border: #4b5563;
        --input-focus: rgba(96, 165, 250, 0.3);
        --error: #fca5a5;
        --divider: #374151;
        --link: #93c5fd;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
    }

    .access-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
    }

    .access-card {
      width: min(100%, 460px);
      padding: clamp(1.5rem, 4vw, 2rem) clamp(1.15rem, 4vw, 1.75rem) 1.5rem;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card-bg);
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
      text-align: center;
    }

    .access-title {
      margin: 0 0 0.75rem;
      font-size: clamp(1.8rem, 3vw, 2.3rem);
      line-height: 1.2;
      color: var(--text);
    }

    .access-subtitle {
      margin: 0 0 1.35rem;
      font-size: clamp(1rem, 2vw, 1.1rem);
      line-height: 1.6;
      color: var(--muted);
    }

    .access-badge {
      display: inline-block;
      margin-bottom: 0.9rem;
      padding: 0.45rem 0.7rem;
      border-radius: 999px;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: clamp(0.7rem, 1.5vw, 0.8rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .access-badge a {
      color: inherit;
      text-decoration: none;
    }

    .access-form {
      text-align: left;
    }

    .access-label {
      display: block;
      margin: 0 0 0.55rem;
      font-size: clamp(0.95rem, 2vw, 1rem);
      font-weight: 600;
      color: var(--text);
    }

    .access-input {
      width: 100%;
      box-sizing: border-box;
      min-height: 48px;
      padding: 0.85rem 0.9rem;
      margin-bottom: 1rem;
      border: 1px solid var(--input-border);
      border-radius: 10px;
      background: var(--input-bg);
      color: var(--input-text);
      font-size: clamp(1rem, 2vw, 1.05rem);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .access-input:focus {
      border-color: var(--link);
      box-shadow: 0 0 0 3px var(--input-focus);
    }

    .access-checkbox {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin: 0 0 1.1rem;
      color: var(--muted);
      font-size: clamp(0.92rem, 1.8vw, 1rem);
      cursor: pointer;
    }

    .access-checkbox input {
      width: 1.1rem;
      height: 1.1rem;
      cursor: pointer;
    }

    .access-button {
      width: 100%;
      min-height: 48px;
      padding: 0.8rem 1rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(180deg, var(--button-start) 0%, var(--button-end) 100%);
      color: #ffffff;
      font-size: clamp(1rem, 2vw, 1.05rem);
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(29, 78, 216, 0.18);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .access-button:hover,
    .access-button:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(29, 78, 216, 0.22);
      outline: 3px solid rgba(191, 219, 254, 0.7);
      outline-offset: 2px;
    }

    .access-error {
      min-height: 1.25rem;
      margin: 0.9rem 0 0;
      color: var(--error);
      font-size: clamp(0.9rem, 1.8vw, 0.95rem);
      line-height: 1.5;
    }

    .access-contact {
      margin-top: 1.6rem;
      padding-top: 1rem;
      border-top: 1px solid var(--divider);
      font-size: clamp(0.8rem, 1.8vw, 0.9rem);
      line-height: 1.5;
      color: var(--muted);
    }

    .access-contact a {
      color: var(--link);
      text-decoration: none;
      font-weight: 500;
    }

    .access-contact a:hover,
    .access-contact a:focus-visible {
      text-decoration: underline;
      outline: 2px solid transparent;
    }

    @media (max-width: 480px) {
      .access-shell {
        padding: 20px 12px;
      }

      .access-card {
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="access-shell" role="main">
    <div class="access-card" aria-labelledby="access-heading">
      <div class="access-badge">
        <a href="https://luc-hoskova.github.io/introR_CUNI/" aria-label="Přejít na domovskou stránku kurzu">
          Zpracování výzkumných dat v R
        </a>
      </div>

      <h1 id="access-heading" class="access-title">Přístup k výukovým materiálům</h1>
      <p class="access-subtitle">Výukové materiály jsou určeny aktivním studentům kurzu. Pro přístup zadejte heslo.</p>

      <form class="access-form" novalidate aria-describedby="access-error">
        <label class="access-label" for="passwordInput">Heslo</label>
        <input
          id="passwordInput"
          class="access-input"
          type="password"
          placeholder="Zadejte heslo"
          autocomplete="current-password"
          inputmode="text"
          aria-label="Heslo pro přístup"
          aria-required="true"
          required
        />

        <label class="access-checkbox" for="showPassword">
          <input id="showPassword" type="checkbox" aria-label="Zobrazit heslo při psaní" />
          Zobrazit heslo
        </label>

        <button id="loginBtn" class="access-button" type="submit" aria-label="Otevřít přístup ke kurzu">
          Otevřít
        </button>

        <p id="message" class="access-error" aria-live="polite" aria-atomic="true"></p>
      </form>

      <div class="access-contact">
        V případě komplikací mě kontaktujte na
        <a href="mailto:lucie.hoskova@ruk.cuni.cz" aria-label="Napište e-mail na Lucii Hoskova">
          lucie.hoskova@ruk.cuni.cz
        </a>
      </div>
    </div>
  </main>

  <script>
    const password = "YOUR_PASSWORD";

    const passwordInput = document.getElementById("passwordInput");
    const showPassword = document.getElementById("showPassword");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");

    showPassword.addEventListener("change", function () {
      passwordInput.type = showPassword.checked ? "text" : "password";
      passwordInput.setAttribute("aria-label", showPassword.checked ? "Heslo pro přístup, aktuálně zobrazené" : "Heslo pro přístup");
    });

    function attemptLogin(event) {
      if (event) {
        event.preventDefault();
      }

      const entered = passwordInput.value;

      if (entered === password) {
        document.body.innerHTML = `
          <main style="padding: 40px; font-family: Arial, sans-serif; color: #111827;">
            <h1>Vítejte</h1>
            <p>Máte přístup k výukovým materiálům.</p>
          </main>
        `;
      } else {
        message.textContent = "Nesprávné heslo. Zkuste to znovu.";
        passwordInput.value = "";
        passwordInput.setAttribute("aria-invalid", "true");
        passwordInput.focus();
      }
    }

    loginBtn.addEventListener("click", attemptLogin);
    document.querySelector(".access-form").addEventListener("submit", attemptLogin);
    passwordInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        attemptLogin(event);
      }
    });
    passwordInput.addEventListener("input", function () {
      passwordInput.setAttribute("aria-invalid", "false");
      if (message.textContent) {
        message.textContent = "";
      }
    });
  </script>
</body>
</html>
